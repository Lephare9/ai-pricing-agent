<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>AI Pris Scanner</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:#e9e9ee;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
}

.app{
    width:100%;
    max-width:390px;
    padding:18px 14px 40px;
}

.logo{
    text-align:center;
    font-size:20px;
    font-weight:700;
    margin-bottom:18px;
    color:#111;
}

.button-row{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.btn{
    flex:1;
    height:46px;
    border:none;
    border-radius:14px;
    background:#000;
    color:#fff;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
}

.preview{
    width:100%;
    border-radius:22px;
    overflow:hidden;
    background:#ddd;
}

.preview img{
    width:100%;
    display:block;
}

.loading{
    display:none;
    text-align:center;
    font-size:18px;
    font-weight:700;
    color:#555;
    margin-top:18px;
}

.card{
    display:none;
    background:#f5f5f5;
    border-radius:24px;
    padding:20px;
    margin-top:16px;
}

.title{
    font-size:16px;
    font-weight:700;
    color:#111;
    margin-bottom:4px;
}

.material{
    font-size:15px;
    color:#666;
    margin-bottom:14px;
}

.price{
    font-size:28px;
    font-weight:800;
    color:#000;
    margin-bottom:12px;
}

.condition{
    font-size:16px;
    font-weight:600;
    color:#111;
    margin-bottom:8px;
}

.hits{
    font-size:15px;
    color:#888;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="app">

    <div class="logo">AI Pris Scanner</div>

    <div class="button-row">
        <button class="btn" onclick="cameraInput.click()">Tag foto</button>
        <button class="btn" onclick="fileInput.click()">Arkiv</button>
    </div>

    <input
        type="file"
        id="cameraInput"
        accept="image/*"
        capture="environment"
        class="hidden"
    >

    <input
        type="file"
        id="fileInput"
        accept="image/*"
        class="hidden"
    >

    <div class="preview">
        <img id="previewImage" src="" style="display:none;">
    </div>

    <div id="loadingText" class="loading">
        Analyserer...
    </div>

    <div class="card" id="resultCard">

        <div class="title" id="title"></div>

        <div class="material" id="material"></div>

        <div class="price" id="price"></div>

        <div class="condition" id="condition"></div>

        <div class="hits" id="hits"></div>

    </div>

</div>

<script>

const API_URL =
"https://ai-pricing-agent-production.up.railway.app/analyze";

const previewImage =
document.getElementById("previewImage");

const resultCard =
document.getElementById("resultCard");

const loadingText =
document.getElementById("loadingText");

document
.getElementById("cameraInput")
.addEventListener("change", handleFile);

document
.getElementById("fileInput")
.addEventListener("change", handleFile);

async function handleFile(e){

    const file = e.target.files[0];

    if(!file) return;

    previewImage.src = URL.createObjectURL(file);

    previewImage.style.display = "block";

    resultCard.style.display = "none";

    loadingText.style.display = "block";

    const formData = new FormData();

    formData.append("file", file);

    try{

        const response = await fetch(API_URL,{
            method:"POST",
            body:formData
        });

        const data = await response.json();

        loadingText.style.display = "none";

        document.getElementById("title").innerText =
            data.title || "Ukendt";

        document.getElementById("material").innerText =
            data.material || "";

        document.getElementById("price").innerText =
            data.price_range || "Ukendt pris";

        document.getElementById("condition").innerText =
            data.condition || "Ukendt stand";

        document.getElementById("hits").innerText =
            `${data.found_prices || 0} fundne priser`;

        resultCard.style.display = "block";

    }catch(error){

        loadingText.style.display = "none";

        document.getElementById("title").innerText =
            "Fejl";

        document.getElementById("material").innerText =
            "";

        document.getElementById("price").innerText =
            "Ukendt pris";

        document.getElementById("condition").innerText =
            "Ukendt stand";

        document.getElementById("hits").innerText =
            "0 fundne priser";

        resultCard.style.display = "block";

        console.error(error);
    }
}

</script>

</body>
</html>
